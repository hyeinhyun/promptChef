<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>My Office Mate</title>
  <link rel="stylesheet" href="../styles/app.css" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body class="font-sans bg-slate-50 text-slate-800" style="width: 380px;">
  <!-- 헤더: 메이트 + 인사고과 -->
  <header class="bg-white px-4 py-3 border-b border-slate-200 flex items-center gap-3">
    <div id="mate-emoji" class="text-3xl">🧑‍💼</div>
    <div class="flex-1 min-w-0">
      <div class="flex items-baseline gap-2">
        <span id="mate-title" class="font-semibold text-sm truncate">메이트</span>
        <span id="level-badge" class="text-[10px] bg-indigo-100 text-indigo-700 rounded-full px-2 py-0.5">Lv.1 수습</span>
      </div>
      <div class="mt-1 h-1.5 w-full bg-slate-200 rounded-full overflow-hidden">
        <div id="exp-bar" class="h-full bg-indigo-500 transition-all" style="width: 0%"></div>
      </div>
      <div id="exp-text" class="text-[10px] text-slate-500 mt-0.5">EXP 0</div>
    </div>
    <button id="open-options" title="설정" class="text-slate-400 hover:text-slate-700 p-1">⚙️</button>
  </header>

  <!-- 입력 -->
  <main class="p-4">
    <label class="block text-xs font-semibold text-slate-600 mb-2">어떤 업무가 필요하신가요?</label>
    <textarea
      id="user-input"
      rows="4"
      maxlength="2000"
      placeholder="예: 다음 주 마케팅 회의에서 발표할 캠페인 결과 공유 자료 만들어줘. 핵심 KPI 위주로."
      class="w-full px-3 py-2 text-sm rounded-lg border border-slate-300 focus:border-indigo-500 focus:ring focus:ring-indigo-100 outline-none resize-none"
    ></textarea>

    <div class="flex items-center justify-between mt-2">
      <div class="flex items-center gap-2 text-xs text-slate-500">
        <label for="brain-select">두뇌</label>
        <select id="brain-select" class="text-xs border border-slate-300 rounded px-1.5 py-0.5 bg-white">
          <option value="fast">⚡ 빠른 두뇌</option>
          <option value="deep">🧠 깊은 두뇌</option>
        </select>
      </div>
      <button
        id="generate-btn"
        class="px-4 py-2 rounded-lg bg-indigo-600 text-white text-sm font-semibold hover:bg-indigo-700 disabled:bg-slate-300 disabled:cursor-not-allowed"
      >
        프롬프트 받기
      </button>
    </div>

    <!-- 상태/오류 -->
    <p id="status" class="text-xs text-slate-500 mt-3 hidden"></p>
    <p id="error" class="text-xs text-rose-600 mt-3 hidden"></p>

    <!-- 결과 카드 -->
    <section id="result-card" class="hidden mt-4 bg-white border border-slate-200 rounded-xl p-3">
      <div class="flex items-center justify-between mb-2">
        <span class="text-xs font-semibold text-slate-600">📄 메이트가 정리해 준 프롬프트</span>
        <span id="result-meta" class="text-[10px] text-slate-400"></span>
      </div>
      <pre id="result-text" class="text-xs whitespace-pre-wrap leading-relaxed bg-slate-50 rounded-lg p-3 max-h-64 overflow-auto font-sans"></pre>
      <button
        id="approve-btn"
        class="mt-3 w-full px-4 py-2 rounded-lg bg-emerald-600 text-white text-sm font-semibold hover:bg-emerald-700"
      >
        👍 결재 완료 (복사)
      </button>
    </section>
  </main>

  <!-- 레벨업 모달 -->
  <div id="levelup-modal" class="hidden fixed inset-0 bg-black/40 flex items-center justify-center p-6">
    <div class="bg-white rounded-2xl p-6 text-center max-w-xs">
      <div class="text-5xl mb-3">🎊</div>
      <div id="levelup-title" class="font-bold text-lg text-slate-800">승진 축하드립니다!</div>
      <div id="levelup-body" class="text-sm text-slate-600 mt-1"></div>
      <button id="levelup-close" class="mt-4 px-4 py-2 rounded-lg bg-indigo-600 text-white text-sm font-semibold">고마워요</button>
    </div>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
