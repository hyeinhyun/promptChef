<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>My Office Mate — 첫 출근</title>
  <link rel="stylesheet" href="../styles/app.css" />
  <link rel="stylesheet" href="onboarding.css" />
</head>
<body class="font-sans bg-slate-50 min-h-screen flex items-center justify-center p-6">
  <main class="w-full max-w-2xl bg-white rounded-2xl shadow-lg p-8">
    <header class="mb-6">
      <p class="text-sm text-slate-500">첫 출근을 환영합니다 👋</p>
      <h1 class="text-2xl font-bold text-slate-800 mt-1">사내 메이트를 정해볼까요?</h1>
      <p class="text-slate-600 mt-2 text-sm">메이트 한 명을 골라 두면, 같은 톤으로 든든하게 도와드려요.</p>
    </header>

    <section class="mb-6">
      <label class="block text-sm font-semibold text-slate-700 mb-2">불러도 되는 이름</label>
      <input
        id="nickname"
        type="text"
        maxlength="16"
        placeholder="예: 현이"
        class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:border-indigo-500 focus:ring focus:ring-indigo-100 outline-none"
      />
    </section>

    <section class="mb-6">
      <label class="block text-sm font-semibold text-slate-700 mb-3">메이트 고르기</label>
      <div id="persona-grid" class="grid grid-cols-1 md:grid-cols-3 gap-3">
        <!-- persona cards 동적으로 채움 -->
      </div>
    </section>

    <div class="flex items-center justify-between">
      <p id="error" class="text-sm text-rose-600 hidden"></p>
      <button
        id="submit"
        class="ml-auto px-6 py-3 rounded-lg bg-indigo-600 text-white font-semibold hover:bg-indigo-700 disabled:bg-slate-300 disabled:cursor-not-allowed"
        disabled
      >
        출근 도장 찍기
      </button>
    </div>
  </main>

  <script type="module" src="onboarding.js"></script>
</body>
</html>
