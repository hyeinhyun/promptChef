<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>My Office Mate — 설정</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen p-6">
  <main class="max-w-xl mx-auto bg-white rounded-2xl shadow p-6">
    <h1 class="text-xl font-bold text-slate-800 mb-1">메이트 설정</h1>
    <p class="text-sm text-slate-500 mb-5">백엔드 연결 정보와 LLM 공급자를 바꿀 수 있어요.</p>

    <section class="space-y-4">
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-1">백엔드 URL</label>
        <input id="backendUrl" type="text" placeholder="http://localhost:8000"
          class="w-full px-3 py-2 rounded-lg border border-slate-300 focus:border-indigo-500 focus:ring focus:ring-indigo-100 outline-none text-sm" />
        <p class="text-[11px] text-slate-400 mt-1">ngrok 주소를 쓰는 경우 https URL 그대로 붙여넣으세요.</p>
      </div>

      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-1">LLM 공급자</label>
        <select id="provider" class="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm bg-white">
          <option value="">자동 (백엔드 기본값)</option>
          <option value="openai">OpenAI</option>
          <option value="google">Google Gemini</option>
        </select>
      </div>

      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-1">두뇌 기본값</label>
        <select id="brain" class="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm bg-white">
          <option value="fast">⚡ 빠른 두뇌</option>
          <option value="deep">🧠 깊은 두뇌</option>
        </select>
      </div>

      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-1">메이트 변경</label>
        <select id="persona" class="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm bg-white">
          <option value="senior">🧑‍💼 꼼꼼한 사수 (박사수)</option>
          <option value="peer">🧑‍🤝‍🧑 싹싹한 동기 (김동기)</option>
          <option value="intern">🧑‍🎓 엉뚱한 인턴 (이인턴)</option>
        </select>
      </div>
    </section>

    <div class="mt-6 flex items-center justify-between">
      <button id="reset" class="text-sm text-rose-600 hover:underline">처음부터 다시 설정</button>
      <button id="save" class="px-4 py-2 rounded-lg bg-indigo-600 text-white text-sm font-semibold hover:bg-indigo-700">저장</button>
    </div>
    <p id="status" class="text-xs text-emerald-600 mt-3 hidden">저장됐어요 ✓</p>
  </main>

  <script type="module" src="options.js"></script>
</body>
</html>
